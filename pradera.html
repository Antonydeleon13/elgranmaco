        <script type="module">
         import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { 
    apiKey: "AIzaSyBRhYDMfZYqFTa0I-oIvf7ObSObKOgEJlo", 
    authDomain: "elgranmaco-46fa2.firebaseapp.com", 
    projectId: "elgranmaco-46fa2",
    storageBucket: "elgranmaco-46fa2.firebasestorage.app",
    messagingSenderId: "409031916784",
    appId: "1:409031916784:web:60f51c79ec56f01098d635",
    databaseURL: "https://elgranmaco-46fa2-default-rtdb.firebaseio.com" 
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const fs = getFirestore(app);

window.db = db;
window.ref = ref;
window.get = get;
window.push = push;
window.fechaSeleccionada = ""; 
window.horaSeleccionada = "";
window.horaApertura = 7; 
window.horaCierre = 21;
window.lunchInicio = -1;
window.lunchFin = -1;
window.ocupados = []; 
let fp;

        // --- CONFIGURACIÓN DE FLATPICKR CORREGIDA ---
    fp = flatpickr("#calendar-inline", {
        inline: true,
        minDate: "today",
        dateFormat: "Y-m-d",
        "locale": "es",
        disableMobile: true,
        disable: [], 
        onChange: (selectedDates, dateStr) => {
        window.fechaSeleccionada = dateStr; // AGREGAR window. AQUÍ
        
        const diasSemana = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
        const fechaObj = new Date(dateStr + "T12:00:00");
        const nombreDia = diasSemana[fechaObj.getDay()];


            // ESCUCHAR DÍAS BLOQUEADOS
            onValue(ref(db, 'sucursales/pradera/dias_bloqueados'), (snapshot) => {
                const bloqueos = snapshot.val() || {};
                const diasADeshabilitar = Object.keys(bloqueos);
                fp.set("disable", diasADeshabilitar);
                fp.redraw();
                
                if(diasADeshabilitar.includes(fechaSeleccionada)) {
                    fechaSeleccionada = "";
                    window.renderSlots();
                }
            });

        get(ref(db, `sucursales/pradera/configuracion_horario/${nombreDia}`)).then((snapshot) => {
            if (snapshot.exists()) {
                const config = snapshot.val();
                // USAR window. EN TODAS LAS VARIABLES DE ABAJO
                window.horaApertura = parseInt(config.apertura) || 8; 
                window.horaCierre = parseInt(config.cierre) || 20;
                window.lunchInicio = (config.lunch_inicio) ? parseInt(config.lunch_inicio) : -1;
                window.lunchFin = (config.lunch_fin) ? parseInt(config.lunch_fin) : -1;
            } else {
                window.horaApertura = 8; window.horaCierre = 20; window.lunchInicio = -1; window.lunchFin = -1;
            }
            window.renderSlots(); 
        }).catch(err => console.error("Error al cargar horario:", err));
    }
    });

    // --- EL "TRUCO" PARA EL DEPLOY: CARGA AUTOMÁTICA AL INICIAR ---
    // --- SOLUCIÓN PARA FECHA LOCAL ---
    const ahora = new Date();
    // Creamos la fecha local usando el año, mes y día de tu zona horaria
    const anio = ahora.getFullYear();
    const mes = String(ahora.getMonth() + 1).padStart(2, '0');
    const dia = String(ahora.getDate()).padStart(2, '0');

    const hoyLocal = `${anio}-${mes}-${dia}`;

    window.fechaSeleccionada = hoyLocal; // Sigue siendo global
    fp.setDate(hoyLocal); 
    // Disparamos el cambio para que cargue los horarios de hoy 29
    fp.config.onChange[0]([ahora], hoyLocal);



    window.renderSlots = () => {
        const container = document.getElementById('slots-container');
        if (!container) return;
        container.innerHTML = "";
        
        // 1. Usar window. para asegurar que lee la fecha actualizada
        if (!window.fechaSeleccionada) {
            console.warn("Esperando selección de fecha...");
            return;
        }

        // 2. Usar window. para las variables de configuración de horario
        const hAper = Number(window.horaApertura) || 6; 
        const hCier = Number(window.horaCierre) || 22;

        console.log(`Dibujando desde ${hAper} hasta ${hCier}`);

        // 3. Importante: Usar window.ocupados (que es donde están las 196 citas)
        const listaDeCitas = window.ocupados || [];

        for (let h = hAper; h < hCier; h++) {
            if (Number(window.lunchInicio) > 0 && Number(window.lunchFin) > 0) {
                if (h >= Number(window.lunchInicio) && h < Number(window.lunchFin)) continue; 
            }

            const isOccupied = listaDeCitas.some(cita => {
                // Limpieza de fecha para evitar errores por espacios o la 'T'
                const fCita = cita.fecha.split('T')[0].split(' ')[0]; 
                if (fCita !== window.fechaSeleccionada) return false;

                const horaParte = cita.fecha.includes('T') ? cita.fecha.split('T')[1] : cita.fecha.split(' ')[1];
                if (!horaParte) return false;
                
                const hInicio = Number(horaParte.split(':')[0]);
                
                let hFin;
                if (cita.horaFin) {
                    const hFinParte = cita.horaFin.includes('T') ? cita.horaFin.split('T')[1] : cita.horaFin;
                    hFin = Number(hFinParte.split(':')[0]);
                } else {
                    hFin = hInicio + 1; 
                }

                return h >= hInicio && h < hFin;
            });

            if (!isOccupied) {
                const div = document.createElement('div');
                div.className = 'slot';
                div.innerText = h > 12 ? `${h-12}:00 PM` : (h === 12 ? `12:00 PM` : `${h}:00 AM`);
                div.onclick = () => {
                    document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
                    div.classList.add('selected');
                    window.horaSeleccionada = `${h.toString().padStart(2, '0')}:00`;
                };
                container.appendChild(div);
            }
        }
    };

          window.actualizarInfoServicio = () => {
    const sel = document.getElementById('servicio');
    const opt = sel.selectedOptions[0];
    if(opt && opt.value !== "") {
        let descripcion = opt.getAttribute('data-desc') || 'Servicio de alta calidad';
        
        // Limpiamos y separamos por puntos o guiones para estructurarlo
        let items = descripcion.split(/[-–•]/).map(item => item.trim()).filter(item => item.length > 0);
        
        let htmlFormateado = '<div style="margin-bottom: 6px; color: var(--gold); font-weight: 600;">Detalles:</div>';
        items.forEach(item => {
            htmlFormateado += `<div style="display: flex; align-items: flex-start; margin-bottom: 6px; font-size: 0.73rem;">
                <span style="color: var(--gold); margin-right: 8px;">▪</span>
                <span style="color: #ccc; line-height: 1.4;">${item}</span>
            </div>`;
        });

        document.getElementById('info-servicio').innerHTML = htmlFormateado;
        document.getElementById('info-servicio').style.display = 'block';
    }
};

        // --- FUNCIÓN PARA ENVIAR LA CITA ---
            window.enviarCita = () => {
        const nom = document.getElementById('nombre').value;
        const num = document.getElementById('whatsapp').value;
        const sel = document.getElementById('servicio');

        if(!nom || !num || !sel.value || !window.horaSeleccionada || !window.fechaSeleccionada) {
            document.getElementById('modalError').style.display = 'flex';
            return;
        }

        const whatsappCompleto = document.getElementById('codigo-area').value + num;
        const servicioNombre = sel.value;
        const horaLimpia = window.horaSeleccionada.includes(':') ? window.horaSeleccionada : `${window.horaSeleccionada}:00`;

        // 1. Guardamos en Realtime Database
        push(ref(db, 'sucursales/pradera/citas'), {
    nombre: nom,
    whatsapp: whatsappCompleto,
    servicio: servicioNombre,
    precio: sel.selectedOptions[0].getAttribute('data-precio'),
    nota: document.getElementById('nota').value || "Sin notas",
    fecha: `${window.fechaSeleccionada}T${horaLimpia}`, 
    estado: 'Pendiente'
}).then(() => {
            // --- ENVÍO DE NOTIFICACIÓN REAL ---
            // Buscamos tu token de administrador que guardamos en barbero.html
            get(ref(db, 'admin_tokens/token_principal')).then((snapshot) => {
                if (snapshot.exists()) {
                    const tokenAdmin = snapshot.val();
                    console.log("Enviando alerta al dispositivo:", tokenAdmin);
                    // Aquí podrías llamar a una Cloud Function o simplemente 
                    // dejar que el 'onChildAdded' del barbero haga su magia.
                }
            });

            const clienteID = nom.toLowerCase().trim().replace(/\s+/g, '_');
            setDoc(doc(fs, "clientes", clienteID), {
                nombre: nom,
                telefono: whatsappCompleto,
                ultima_visita: new Date().toISOString()
            }, { merge: true });

            document.getElementById('modalExito').style.display = 'flex';
        }).catch(err => {
            console.error("Error al agendar:", err);
            showToast("Error de conexión al agendar");
        });
    };

            // --- ESCUCHA DE CITAS PARA BLOQUEO EN TIEMPO REAL ---
            onValue(ref(db, 'sucursales/pradera/citas'), (snap) => {
        window.ocupados = []; // <--- AGREGA "window." AQUÍ
        snap.forEach(c => { 
            const d = c.val();
            const estadoLimpio = (d.estado || "").trim().toUpperCase();

            if(d.fecha && estadoLimpio !== 'CANCELADA' && estadoLimpio !== 'FINALIZADA') { 
                let fNormalizada = d.fecha.replace(" ", "T").substring(0, 16);
                let hFinLimpia = null;
                if (d.horaFin) {
                    hFinLimpia = d.horaFin.includes("T") ? d.horaFin : `${fNormalizada.split('T')[0]}T${d.horaFin}`;
                    hFinLimpia = hFinLimpia.replace(" ", "T").substring(0, 16);
                }
                window.ocupados.push({ fecha: fNormalizada, horaFin: hFinLimpia }); // <--- AGREGA "window." AQUÍ
            }
        });
        console.log("Citas ocupadas actualizadas:", window.ocupados); // <--- AGREGA "window." AQUÍ
        window.renderSlots(); 
    });

            // CARGAR SERVICIOS
            onValue(ref(db, 'sucursales/pradera/servicios'), (snap) => {
                const sel = document.getElementById('servicio');
                sel.innerHTML = '<option value="" disabled selected>Elige un servicio...</option>';
                snap.forEach(s => {
                    const d = s.val(), option = document.createElement('option');
                    option.value = d.nombre; option.text = `${d.nombre} - Q${d.precio}`;
                    option.setAttribute('data-precio', d.precio);
                    option.setAttribute('data-desc', d.detalle || 'Servicio de alta calidad');
                    sel.appendChild(option);
                });
            });
        </script>
    </body>
